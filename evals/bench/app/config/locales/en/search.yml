en:
  search:
    connected:
      title: Search connected apps
      hint: Searches the last 14 days of activity across your connected GitHub, Slack and Linear accounts.
      more: Load more
      truncated: Showing the first pages only. Narrow the search or load more.
      skipped: "%{providers} not connected"
      empty: Nothing matched in the last 14 days.
    tools:
      github:
        description: Search GitHub issues or pull requests from the last 14 days of activity.
      slack:
        description: Search messages and thread replies in a connected Slack channel from the last 14 days.
      linear:
        description: Search Linear issues updated in the last 14 days, optionally within one team.
      params:
        q: Text to match in the title.
        since_days: Days of history to search. Defaults to 14.
        pages: Pages to fetch in this call, at most 5.
        cursor: Continue from the next_cursor of a previous call.
        kind: Either issue or pull_request. Defaults to issue.
        channel: Slack channel ID. Defaults to the first configured channel.
        team_key: Linear team key, such as ENG.
    errors:
      not_connected: "%{provider} is not connected for this user."
      page_limit: "At most %{max} pages per search (asked for %{pages})."
