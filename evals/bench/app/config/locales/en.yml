    not_found: We could not find that %{resource}.
    forbidden: You do not have access to this %{resource}.
    unauthorized: Sign in or provide a valid API key.
    conflict: Someone else is changing this right now. Try again in a moment.
    rate_limited: Too many requests. Slow down and retry after %{seconds} seconds.
    messages:
      wrong_company: belongs to a different company
      in_past: must be in the future
      unknown: 'contains unknown events: %{events}'
      unknown_keys: 'contains unsupported keys: %{keys}'
