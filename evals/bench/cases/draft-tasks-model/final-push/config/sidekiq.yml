:concurrency: 10
:queues:
  - [critical, 4]
  - [default, 2]
  - [notifications, 2]
  - [connectors, 1]
  - [low, 1]

:schedule:
  send_due_reminders:
    cron: "*/5 * * * *"
    class: Tasks::Jobs::SendDueRemindersJob
    queue: notifications
  send_scheduled_drafts:
    cron: "* * * * *"
    class: DraftTasks::Jobs::SendScheduledDraftsJob
    queue: default
  reset_weekly_budgets:
    cron: "5 0 * * *"
    class: Points::Jobs::ResetWeeklyBudgetsJob
    queue: low
  release_stale_reservations:
    cron: "15 0 * * *"
    class: Points::Jobs::ReleaseStaleReservationsJob
    queue: low
  archive_stale_tasks:
    cron: "30 2 * * *"
    class: Tasks::Jobs::ArchiveStaleTasksJob
    queue: low
  reindex_routes:
    cron: "0 4 * * *"
    class: Search::Jobs::ReindexRoutesJob
    queue: low
