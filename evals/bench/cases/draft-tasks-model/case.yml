title: Escrow points on draft tasks
body: |
  Marking a draft ready now holds its points in escrow against the author's weekly budget, and sending it
  moves that amount into the ledger instead of running the task through the normal award path.

  **What changed**

  - `DraftTask` validates `points` against the author's weekly budget (`points_within_budget`), gains a
    `reserving` scope and `release_reservation!`, which moves a ready draft back to drafting.
  - `GivingBalance` reports the escrow as `reserved` and exposes `escrowed?`.
  - `MarkReady` checks the balance and takes the hold; `Release` frees it. Lock contention comes back as a
    normal command failure instead of an exception.
  - `SendDraft` creates the task with `escrowed: true` so `Tasks::Commands::Create` neither re-checks the
    balance (the hold is already subtracted) nor awards again; `Points::Commands::SettleReservation` then
    writes the ledger entry tied to the draft (`draft_task_id`) and the task. `send_now` accepts an optional
    `points` override so a sender can adjust the reward at send time.
  - `Update` writes only the changed fields so an edit cannot clobber a concurrent state change.
  - `GET /api/v1/draft_tasks/reservations` lists the drafts holding the caller's points, newest first,
    capped by `limit`. Draft JSON carries `author_name`.
  - Share pages show drafts sent in the last 7 days with the task they became, next to the ready ones.
  - `Points::Jobs::ReleaseStaleReservationsJob` runs nightly and releases ready drafts whose author no
    longer has an active membership.

  **Tradeoff**

  Drafts of deactivated users are released by the nightly job rather than on deactivation. Memberships are
  removed in several places (admin UI, SCIM, company purge) and I did not want to thread a release through
  each for this PR; a stale hold lingers for at most a day and only affects the departed user's own budget.

  **Testing**

  - Specs for the model, every command, the new query, the job, the blueprint and the public view; request
    specs for the reservations endpoint, send_now and the share page.
  - Manually: draft with 20 points, mark ready, `/api/v1/points` shows 20 reserved; send, one ledger entry
    for 20 with the draft id, balance moves from reserved to spent. Removed a membership, ran the job,
    draft went back to drafting.
delete: []
first_push_delete: []
labels:
  - title: Concurrent mark_ready calls can over-reserve the budget
    file: app/lib/draft_tasks/commands/mark_ready.rb
    label: real
    push: first
    note: >
      Early MarkReady#reserve reads GivingBalance (a plain DraftTask.ready.where(author_id:) sum) and
      calls mark_ready! under only the per-draft lock, so two mark_ready requests for two drafts of one
      author both see the pre-hold balance and both pass, holding more than the weekly budget. Head wraps
      the check and transition in Points::Services::WithLockedGiver.
  - title: release_reservation! can undo a concurrent send
    file: app/models/draft_task.rb
    label: real
    push: first
    note: >
      Early DraftTask#release_reservation! checks ready? in memory then does an unfiltered
      set(state: "drafting", ready_at: nil). ReleaseStaleReservations iterates drafts outside the draft lock,
      so an instance loaded as ready that SendScheduledDraftsJob sends meanwhile is written back to drafting
      after its task and ledger entry exist, and can be sent again. Head claims it with
      where(_id:, state: "ready").find_one_and_update and raises WrongState on nil.
  - title: Update can overwrite a draft that was sent in the meantime
    file: app/lib/draft_tasks/commands/update.rb
    label: real
    push: both
    note: >
      Update#call checks editable? on the in-memory draft, then runs
      DraftTask.where(_id: draft.id).find_one_and_update({"$set" => changes}) with no state filter and
      ignores the returned document, so an edit landing after a concurrent mark_ready + send overwrites
      title/points on a sent draft. It should filter on state: "drafting" and fail when nil comes back.
  - title: Private sent drafts leak the author's name on the share page
    file: app/lib/lists/services/draft_public_view.rb
    label: real
    push: both
    note: >
      DraftPublicView#call branches on draft.sent?; only pending_view consults draft.private?. sent_view
      always renders draft.author.display_name, and PublicList now includes drafts sent in the last 7 days,
      so GET /s/:token shows the author of a private draft as soon as it has a sent_task_id.
  - title: Ledger entry on send uses the request's points, not the reservation
    file: app/lib/draft_tasks/commands/send_draft.rb
    label: real
    push: final
    note: >
      SendDraft#settle_amount returns points.to_i when send_now carries a points param and passes it to
      SettleReservation, while the task is built from locked.task_attributes (the held amount) and the
      balance was checked against locked.points. points: 1 (or 500) moves a different amount through the
      ledger than was held or put on the task, with no balance check.
  - title: limit param parsing turns an array into 1
    file: app/controllers/api/v1/draft_tasks_controller.rb
    label: nit
    kind: latent edge case
    push: both
    note: >
      reservation_limit does (params[:limit].presence || DEFAULT).to_s.to_i.clamp(1, 100); a limit[] array
      stringifies to '["5"]', to_i gives 0, clamp gives 1. No client sends an array-shaped limit.
  - title: author_name field queries the author per draft
    file: app/lib/draft_tasks/blueprints/draft_task_blueprint.rb
    label: nit
    kind: performance
    push: both
    note: >
      field :author_name calls draft.author.display_name, one User read per draft on index (paginated to
      25) and reservations (capped at 100); the author is the caller on both, so cheap primary-key reads.
  - title: Duplicate reservation case in the balance spec
    file: spec/lib/points/queries/giving_balance_spec.rb
    label: nit
    kind: test gap
    push: both
    note: >
      "holds escrow for the author's ready drafts and nobody else's" sets up and asserts exactly what
      "subtracts reservations held by ready drafts only" already covers, under a different name.
  - title: Lock contention reported as 422 instead of 409
    file: app/lib/draft_tasks/commands/mark_ready.rb
    label: nit
    kind: messaging
    push: both
    note: >
      MarkReady rescues Lock::Busy (and the giver lock at head) into Result.failure(e.message), a string, so
      render_failure answers 422 instead of the 409 HandlesErrors maps the exception to. The request is
      correctly refused and nothing is written; only the status is misleading.
  - title: Deactivated users' drafts are released nightly, not on deactivation
    file: app/lib/points/jobs/release_stale_reservations_job.rb
    label: nit
    kind: documented tradeoff
    push: both
    note: >
      A removed member's ready drafts keep their hold until the 00:15 job runs. The PR body states this on
      purpose and the hold only affects the departed user's own budget.
  - title: rescue StandardError around the ledger write looks like it swallows failures
    file: app/lib/points/commands/settle_reservation.rb
    label: wrong
    push: both
    note: >
      SettleReservation#write_entry rescues StandardError, logs, then bare `raise` re-raises, so a failed
      ledger write still propagates out of SendDraft and the draft stays ready. Nothing is swallowed.
  - title: mark_sent! looks like it runs outside the draft lock
    file: app/lib/draft_tasks/commands/send_draft.rb
    label: wrong
    push: both
    note: >
      finalize(locked, task) is a private method, but it is only called from inside the WithLockedDraft.call
      block with the instance the block yielded, so mark_sent! runs while the per-draft lock is held.
  - title: Create does not check the author's balance
    file: app/lib/draft_tasks/commands/create.rb
    label: wrong
    push: both
    note: >
      Creating a draft holds nothing, so no remaining-balance check belongs there; the cap is enforced by
      DraftTask's validate :points_within_budget (points <= membership.points_budget), which Create hits via
      draft.save, and the remaining-balance check happens in MarkReady when the hold is taken.
# Accidents of case authoring that Thingie raised on bonusly/thingie#139, kept as labels because they are realistic noise.
  - title: Non-local return inside the lock blocks skips lock cleanup
    file: app/lib/draft_tasks/commands/mark_ready.rb
    label: wrong
    push: both
    note: "the return statements inside the WithLockedDraft.call and WithLockedGiver.call blocks unwind past the services, but both services release their lock in an ensure (with_locked_draft.rb, with_locked_giver.rb), which runs on return; nothing is skipped"
  - title: assignees plural keys never match English rules
    file: config/locales/en/tasks.yml
    label: nit
    kind: latent edge case
    push: both
    note: "the assignees entry uses plural keys English never selects, so one form is dead; the rendered copy is correct for every count a caller sends"
  - title: Inconsistent indentation in routes.rb
    file: config/routes.rb
    label: nit
    kind: style
    push: both
    note: "a nested resources block is indented one level off; routes resolve the same"
