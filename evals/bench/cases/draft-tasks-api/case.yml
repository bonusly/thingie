title: Add the draft tasks API
body: |
  Finishes the drafts API so the web client can ship the Drafts page. The controller that landed with the
  model was a stub with no gate, no attachment support and no way to see what a draft turned into.

  What's here:

  - `GET /draft_tasks` (paged, `state` and `list_id` filters), `show`, `create`, `update`, `destroy`,
    `mark_ready`, `release`, `send_now`. The three transitions now take a `draft_task` body with the
    last-minute `note` and `scheduled_for` so the client can mark ready and schedule in one call.
  - A writable-key guard: `state`, `author_id` and `points_reserved_at` in a body are a 422 instead of
    being silently dropped, on every mutating action.
  - `PATCH /draft_tasks/:id/attachment` swaps the draft's voice or video note for an already-uploaded
    `Attachment`. The upload must be audio or video, unclaimed, and from the draft's company. On send the
    recording moves onto the task.
  - `GET /draft_tasks/:id/comments` lists the sent task's comments and links each draft-originated one
    back to its draft.
  - Everything sits behind `Features.enabled?(:draft_tasks, ...)` (new `Features` service, rules in
    `config/features.yml`). Off for everyone in test; on in development; two pilot companies in
    production.
  - `Update` keeps a `revision` and `last_edited_by_id` so the client can detect stale edits.
  - Send and release are filtered claims on the stored state (`DraftTask#claim!`) rather than AASM
    transitions on whatever was in memory, under the existing per-draft Redis lock. List delivery now
    creates the task and the note comment before finalizing so the `draft_sent` notification can carry
    the comment id.

  Tradeoff, on purpose: attachment replacement removes the old recording before the new upload is
  claimed, so if the claim fails validation the draft ends up with no recording. The client validates
  size and type before uploading, so this only bites on an upload that slipped past that. Validating
  the new one before touching the old is in a follow-up.

  Testing: request specs for every endpoint, command specs for the new and reworked commands, policy and
  Features specs. Ran the drafts page against this locally with the flag on for my company and walked
  draft -> ready -> send, release, and a recording swap.
delete: []
early_delete: []
labels:
  - title: Transition bodies bypass the writable-key guard
    file: app/controllers/api/v1/draft_tasks_controller.rb
    label: real
    push: early
    note: >-
      At the early push `guard_draft_keys!` runs only for create and update, and `final_edits` is
      `params.fetch(:draft_task, {}).permit!.to_h`; MarkReady/Release/SendDraft then `assign_attributes`
      or `update` the whole hash, so a client can set `author_id` (reserving points from another member's
      budget and handing them the draft), `state` or `points_reserved_at` on mark_ready, release and
      send_now. Head guards all six mutating actions and the commands slice to FINAL_EDITS.
  - title: Release overwrites a concurrent send
    file: app/lib/draft_tasks/commands/release.rb
    label: real
    push: early
    note: >-
      At the early push Release does not take WithLockedDraft and ends with
      `draft.update(state: "drafting", ready_at: nil, points_reserved_at: nil)` with no state filter; a
      send that lands between the `draft.sent?` check and the update is overwritten, leaving a draft in
      drafting with a task already created and points spent. Head uses `resume_drafting!`, a filtered
      claim on state "ready", under the lock.
  - title: Attachment lookup is not scoped to the company
    file: app/lib/draft_tasks/commands/replace_attachment.rb
    label: real
    push: early
    note: >-
      At the early push `find_attachment` is `Attachment.where(id: attachment_id).first`, so any
      unclaimed audio/video upload from any company can be attached to the draft by id and then moves
      onto the task on send. Head scopes it with `Attachment.for_company(draft.company)`.
  - title: mark_sent! runs after the lock is released
    file: app/lib/lists/commands/convert_draft_task_comment.rb
    label: real
    push: both
    note: >-
      ConvertDraftTaskComment calls SendDraft with `finalize: false` (task created under WithLockedDraft)
      and then calls `draft.mark_sent!(task)` after the block has returned the lock. A release that claims
      ready -> drafting in between makes the claim in `mark_sent!` raise WrongState: the task exists,
      points are spent, and the draft is back in drafting where it can be marked ready and sent again.
  - title: Retry after task creation makes a second task
    file: app/lib/draft_tasks/commands/send_draft.rb
    label: real
    push: both
    note: >-
      SendDraft always calls `create_task(locked)` without first checking
      `Task.where(draft_task_id: locked.id)`. If a job (SendScheduledDraftsJob retry 3,
      ConvertDraftTasksJob retry 5) fails between task creation and `mark_sent!`, the retry finds the
      draft still ready and creates and awards a second task.
  - title: Policy and controller check the flag against different subjects
    file: app/policies/draft_task_policy.rb
    label: real
    push: head
    note: >-
      `mark_ready?` adds `Features.enabled?(:draft_tasks, user)` while RequiresFeature checks
      `Features.enabled?(:draft_tasks, current_company)`. Features matches a Company by slug and a User
      by email, so a flag rolled out with `companies:` (the production config) passes the controller and
      fails the policy: mark_ready is a 403 for every pilot company. Specs enable the flag with
      `everyone: true` so they do not see it.
  - title: Per-comment DraftTask.find in the comments blueprint
    file: app/lib/draft_tasks/blueprints/comment_blueprint.rb
    label: nit
    kind: performance
    push: both
    note: >-
      The `draft` field does `DraftTask.find(comment.draft_task_id)` per comment. The list is capped at
      ListDraftComments::LIMIT (50) and in practice one comment per task comes from a draft, so this is
      a handful of extra reads on a cold endpoint, not something to block on.
  - title: Lock::Busy lives in the Send command but is raised by the lock service
    file: app/lib/draft_tasks/services/with_locked_draft.rb
    label: nit
    kind: structure
    push: both
    note: >-
      WithLockedDraft raises `DraftTasks::Commands::SendDraft::Lock::Busy`, which MarkReady and Release
      also rescue, so the error class is owned by one command but shared by three callers and the lock
      service. Behaviour is correct; this is placement.
  - title: Old recording is removed before the new upload is validated
    file: app/lib/draft_tasks/commands/replace_attachment.rb
    label: nit
    kind: documented tradeoff
    push: both
    note: >-
      `draft.attachment&.destroy` runs before `attachment.update(draft_task_id: ...)`, so a media-limit
      validation failure on the new upload leaves the draft with no recording. Only reachable when an
      over-limit media file got past the client's pre-upload check, and the PR body states it as a
      deliberate tradeoff with a follow-up.
  - title: Attachment 422 body has a different shape
    file: app/controllers/api/v1/draft_tasks/attachments_controller.rb
    label: nit
    kind: messaging
    push: both
    note: >-
      Validation failures from ReplaceAttachment render `{ errors: [...] }` while InvalidAttachment and
      the rest of the API render `{ error: { code, message } }`. Status and behaviour are right; the
      client just has two shapes to parse.
  - title: State filter spec covers only the happy path
    file: spec/requests/api/v1/draft_tasks_spec.rb
    label: nit
    kind: test gap
    push: both
    note: >-
      "lists the caller's drafts, filtered by state" asserts only `state=ready`; an unknown state value
      (ignored by ListDrafts) and the no-filter case are not asserted at the request level. The query
      spec covers both already.
  - title: Mongo::Error::OperationFailure looks swallowed in the scheduled job
    file: app/lib/draft_tasks/jobs/send_scheduled_drafts_job.rb
    label: wrong
    push: both
    note: >-
      `send_one` rescues Mongo::Error::OperationFailure, logs, and then `raise`s, so Sidekiq retries the
      job (retry: 3). Nothing is dropped.
  - title: Draft lookup appears unscoped
    file: app/controllers/api/v1/draft_tasks_controller.rb
    label: wrong
    push: both
    note: >-
      `draft_tasks.find(params[:id])` reads like a bare find, but `draft_tasks` comes from DraftTaskScoped
      and is `current_company.draft_tasks`, a has_many relation that adds `company_id` to the criteria;
      another company's id raises DocumentNotFound and renders 404 (covered by the request spec).
  - title: Update looks like it writes twice
    file: app/lib/draft_tasks/commands/update.rb
    label: wrong
    push: both
    note: >-
      `assign_attributes` is in-memory for validation only; the single persistence is the `draft.set(...)`
      call that writes the changed fields, `revision` and `last_edited_by_id` in one `$set`. There is no
      save-then-set double write.
