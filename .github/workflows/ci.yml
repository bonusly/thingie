name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec

  specs-ruby-llm-2:
    name: Specs (ruby_llm 2)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/ruby_llm_2.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec
