name: "Thingie Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number"
        required: true

concurrency:
  group: thingie-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # Mint an app installation token so review comments post under the app's
      # name/avatar. Skipped (falls back to GITHUB_TOKEN) when the app isn't set up.
      - uses: actions/create-github-app-token@v3
        id: app_token
        if: ${{ vars.THINGIE_APP_ID != '' }}
        with:
          client-id: ${{ vars.THINGIE_APP_ID }}
          private-key: ${{ secrets.THINGIE_APP_PRIVATE_KEY }}
      - name: Run Thingie review
        uses: ./.github/actions/thingie
        env:
          PR_NUMBER_FROM_WORKFLOW_DISPATCH: ${{ github.event.inputs.pr_number }}
        with:
          api_key: ${{ secrets.LLM_API_KEY }}
          system_one_api_key: ${{ secrets.SYSTEM_ONE_API_KEY }}
          #model: ${{ vars.LLM_MODEL }}
          provider: ${{ vars.LLM_PROVIDER }}
          ruby_version: ${{ vars.RUBY_VERSION || '3.4' }}
          thingie_version: local
          # Post as the app when configured, otherwise as github-actions.
          github_token: ${{ steps.app_token.outputs.token || github.token }}
          # PAT (user token) with pull-requests write so stale review threads can
          # be auto-resolved. GITHUB_TOKEN and GitHub App installation tokens
          # cannot call resolveReviewThread. Resolution is skipped if unset.
          resolve_token: ${{ secrets.THINGIE_RESOLVE_TOKEN }}
          # Emit per-call token counts, cost, and tool-call details to the job
          # log. Override by setting the THINGIE_DEBUG repository variable to
          # 'false' or '0' to silence it.
          debug: ${{ vars.THINGIE_DEBUG != 'false' && vars.THINGIE_DEBUG != '0' && 'true' || 'false' }}
