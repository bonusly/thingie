name: "Thingie Approve"
description: "Approve pull requests that GitHub Copilot approved, when Thingie's safety rules pass"
branding:
  icon: "check"
  color: "green"
inputs:
  ruby_version:
    description: "Ruby version to install for running Thingie"
    required: false
    default: "3.4"
  thingie_version:
    description: >-
      Thingie gem version to install. Use 'local' to build and install from the
      checked-out repo, or 'skip' to install nothing (when thingie_command
      already provides Thingie, e.g. via your Gemfile).
    required: false
    default: ">= 0"
  thingie_command:
    description: >-
      Command used to invoke the Thingie CLI. Defaults to 'thingie'. Set to
      something like 'bundle exec thingie' for setups that need it.
    required: false
    default: "thingie"
  github_token:
    description: >-
      Token used to read the PR and post the approval and status comment.
      Falls back to the workflow GITHUB_TOKEN when unset. Needs pull-requests
      write.
    required: false
  resolve_token:
    description: >-
      Personal access token tried when the main token can't approve or dismiss,
      and used to read team membership (read:org) when `approval_team` is set.
      Optional.
    required: false
  debug:
    description: "Enable debug logging (sets THINGIE_DEBUG=1)."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby_version }}
        bundler-cache: true
    - name: Install Thingie
      shell: bash
      env:
        THINGIE_VERSION: ${{ inputs.thingie_version }}
        THINGIE_CMD: ${{ inputs.thingie_command }}
      run: |
        if [ "$THINGIE_VERSION" = "skip" ]; then
          echo "Skipping install; using '$THINGIE_CMD' to run Thingie."
        elif [ "$THINGIE_VERSION" = "local" ]; then
          gem build thingie.gemspec -o thingie.gem
          gem install ./thingie.gem
        else
          gem install thingie -v "$THINGIE_VERSION"
        fi
    - name: Run Thingie approve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        THINGIE_RESOLVE_TOKEN: ${{ inputs.resolve_token }}
        THINGIE_CMD: ${{ inputs.thingie_command }}
        THINGIE_DEBUG: ${{ inputs.debug == 'true' && '1' || '' }}
      # Unquoted so multi-word commands (e.g. "bundle exec thingie") word-split.
      run: $THINGIE_CMD approve
