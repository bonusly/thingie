[approve]
# Auto-approve the PR when GitHub Copilot's latest review approves the PR's
# current commit and every rule below passes. Disabled by default. The approval
# is attempted with the main token first, then the resolve-token user
# (THINGIE_RESOLVE_TOKEN), so it counts toward branch protection. Requires the
# workflow's `pull-requests: write` permission.
enabled = false
# Block approval when additions + deletions exceed this. Also blocks approval
# when GitHub doesn't report the size (fails safe).
max_changes = 500
# Add this label to a PR to skip auto-approval entirely.
skip_label = "thingie-skip-approve"
# Glob patterns that block auto-approval when any changed file matches — e.g.
# billing code or sensitive config that always wants human eyes. Changes to
# .thingie/config.toml are always blocked. By default the whole .thingie/
# directory is protected so Thingie never auto-approves changes to its own
# config. NOTE: setting protected_paths in a project replaces this default, so
# include ".thingie/**/*" there too if you override it.
protected_paths = [".thingie/**/*"]
# Evaluate the rules and log the decision without approving or dismissing.
dry_run = false
# When set to an "org/team-slug" (e.g. "bonusly/pr-auto-approval"), only
# auto-approve PRs whose author is a member of that GitHub team — a controlled
# allowlist managed from GitHub org settings. Empty means any author is eligible
# (subject to the other rules). A non-member is skipped (not blocked), so an
# existing human approval is left intact. Reading team membership needs a token
# with read:org, which the Actions GITHUB_TOKEN usually lacks; set
# THINGIE_RESOLVE_TOKEN to a PAT with read:org. Membership that can't be
# determined fails safe (not eligible).
approval_team = ""
# Bot logins also eligible when approval_team is set, e.g. ["loop-de-loops[bot]"].
# A GitHub App can't be a team member, so list it here; the login must match the
# PR author exactly. Ignored when approval_team is empty.
approval_bots = []
# "owner/name" repositories whose GitHub Actions runs, when the PR description or one of
# the PR author's comments links one, must have run a commit on that repository's default
# branch, e.g. ["bonusly/loop-de-loop"]. A run dispatched from another branch ran that
# branch's copy of the workflow, so the PR is blocked. A run Thingie can't read doesn't
# block; the approval lists it as not checked.
main_branch_run_repos = []
# Other required checks Thingie does not evaluate but that still gate merge (e.g.
# a security scan, the test suite). Listed in the approval comment so it's clear
# Thingie's approval isn't the only gate — these do not affect Thingie's decision.
external_checks = []


[stats]
# Emit a machine-readable stats event after each auto-approval decision, so
# admins can build dashboards (Datadog, Logstash, ...). Nothing is emitted
# unless enabled AND at least one [[stats.sinks]] destination is configured.
enabled = false

# Constant key/value pairs copied into every stats event under "tags".
[stats.tags]

# Destinations, one [[stats.sinks]] block each. Built-in types:
#   jsonl   — append one JSON object per event to a file, or to stdout/stderr
#   command — pipe one JSON line per event to an external command's stdin
# Any gem can register additional sink types via Thingie::Stats.register_sink;
# set `require` to have it loaded before the type is looked up.
# [[stats.sinks]]
# type = "jsonl"
# path = "log/thingie-stats.jsonl"   # or "stdout" / "stderr"
#
# [[stats.sinks]]
# type = "command"
# command = "my-stats-shipper"
# require = "my_thingie_sink_gem"    # optional: required before type lookup
